# PIPELINE DEFINITION
# Name: fashion-mnist-pipeline
# Description: An end-to-end pipeline with Model Registry incorporation
# Inputs:
#    bucket_name: str
#    data_path: str
components:
  comp-download-and-preprocess:
    executorLabel: exec-download-and-preprocess
    inputDefinitions:
      parameters:
        bucket_name:
          parameterType: STRING
        data_path:
          parameterType: STRING
  comp-train-fashion-mnist:
    executorLabel: exec-train-fashion-mnist
    inputDefinitions:
      parameters:
        bucket_name:
          parameterType: STRING
        data_path:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        model_output_uri:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
  comp-upload-model-to-registry:
    executorLabel: exec-upload-model-to-registry
    inputDefinitions:
      artifacts:
        model_artifact:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        display_name:
          parameterType: STRING
        location:
          parameterType: STRING
        project:
          parameterType: STRING
        serving_container_image_uri:
          parameterType: STRING
deploymentSpec:
  executors:
    exec-download-and-preprocess:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - download_and_preprocess
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'tensorflow'\
          \ 'numpy' 'google-cloud-storage'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.16.1' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef download_and_preprocess(bucket_name: str, data_path: str):\n\
          \    import tensorflow as tf\n    import numpy as np\n    from google.cloud\
          \ import storage\n    import os\n\n    print(\"--- Data Download and Preprocessing\
          \ ---\")\n\n    # Load data\n    (X_train, y_train), (X_test, y_test) =\
          \ tf.keras.datasets.fashion_mnist.load_data()\n    X_train, X_test = X_train\
          \ / 255.0, X_test / 255.0\n\n    # Temporary stored data in the container\n\
          \    np.save(\"X_train.npy\", X_train)\n    np.save(\"y_train.npy\", y_train)\n\
          \    np.save(\"X_test.npy\", X_test)\n    np.save(\"y_test.npy\", y_test)\n\
          \n    # Send the saved data to the Cloud Storage Bucket\n    client = storage.Client()\n\
          \    bucket = client.bucket(bucket_name)\n\n    for filename in [\"X_train.npy\"\
          , \"y_train.npy\", \"X_test.npy\", \"y_test.npy\"]:\n        blob = bucket.blob(os.path.join(data_path,\
          \ filename))\n        blob.upload_from_filename(filename)\n\n    print(\"\
          Data preparation completed and uploaded to GCS!\")\n\n"
        image: python:3.13
    exec-train-fashion-mnist:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train_fashion_mnist
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'tensorflow'\
          \ 'numpy' 'google-cloud-storage'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.16.1' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train_fashion_mnist(\n    bucket_name: str, \n    data_path:\
          \ str, \n    model_output_uri: Output[Model]\n):\n    import tensorflow\
          \ as tf\n    import numpy as np\n    from google.cloud import storage\n\
          \    import os\n\n    # Access the stored data in bucket\n\n    # Connect\
          \ to the Google Cloud System (GCS)\n    client = storage.Client()\n    bucket\
          \ = client.bucket(bucket_name)\n    for filename in [\"X_train.npy\", \"\
          y_train.npy\"]:\n        blob = bucket.blob(os.path.join(data_path, filename))\n\
          \        blob.download_to_filename(filename)\n    X_train = np.load(\"X_train.npy\"\
          )\n    y_train = np.load(\"y_train.npy\")\n\n    # Create a model (same\
          \ as the local version)\n    model = tf.keras.models.Sequential([\n    \
          \    tf.keras.layers.Flatten(input_shape=(28, 28)),\n        tf.keras.layers.Dense(128,\
          \ activation=\"relu\"),\n        tf.keras.layers.Dense(10, activation=\"\
          softmax\")\n    ])\n    model.compile(\n        optimizer=\"adam\",\n  \
          \      loss=\"sparse_categorical_crossentropy\",\n        metrics=[\"accuracy\"\
          ]\n    )\n    model.fit(X_train, y_train, epochs=3)\n\n    os.makedirs(model_output_uri.path,\
          \ exist_ok=True)\n    model.save(os.path.join(model_output_uri.path, \"\
          model.keras\"))\n    print(\"Model trained and output artifact paths registered!\"\
          )\n\n"
        image: python:3.13
    exec-upload-model-to-registry:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - upload_model_to_registry
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'google-cloud-aiplatform'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef upload_model_to_registry(\n    project: str,\n    location: str,\n\
          \    display_name: str,\n    model_artifact: dsl.Input[dsl.Model],\n   \
          \ serving_container_image_uri: str\n):\n    from google.cloud import aiplatform\n\
          \    from google.cloud.aiplatform import Model\n\n    print(f\"Initializing\
          \ AI Platform for project: {project} at {location}\")\n    aiplatform.init(project=project,\
          \ location=location)\n\n    print(\"Checking for existing model versions\
          \ in Model Registry...\")\n    gcs_model_uri = model_artifact.uri\n    model_list\
          \ = Model.list(filter=f'display_name=\"{display_name}\"', order_by=\"create_time\
          \ desc\")\n    parent_model = None\n    if model_list:\n        parent_model\
          \ = model_list[0].resource_name\n        print(f\"Found existing model.\
          \ Registering as a new version under parent: {parent_model}\")\n    else:\n\
          \        print(\"No existing model found with this display name. Creating\
          \ a new parent mode asset.\")\n\n    print(f\"Automated uploading model\
          \ from GCS Path: {gcs_model_uri}\")\n\n    uploaded_model = aiplatform.Model.upload(\n\
          \        display_name=display_name,\n        artifact_uri=gcs_model_uri,\n\
          \        serving_container_image_uri=serving_container_image_uri,\n    \
          \    parent_model=parent_model,\n        serving_container_health_route=\"\
          /health\",\n        serving_container_predict_route=\"/predict\"\n    )\n\
          \    print(f\"Successfully registered model! Resource Name: {uploaded_model.resource_name}\"\
          )\n\n"
        image: python:3.13
pipelineInfo:
  description: An end-to-end pipeline with Model Registry incorporation
  name: fashion-mnist-pipeline
root:
  dag:
    tasks:
      download-and-preprocess:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-download-and-preprocess
        inputs:
          parameters:
            bucket_name:
              componentInputParameter: bucket_name
            data_path:
              componentInputParameter: data_path
        taskInfo:
          name: download-and-preprocess
      train-fashion-mnist:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-fashion-mnist
        dependentTasks:
        - download-and-preprocess
        inputs:
          parameters:
            bucket_name:
              componentInputParameter: bucket_name
            data_path:
              componentInputParameter: data_path
        taskInfo:
          name: train-fashion-mnist
      upload-model-to-registry:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-upload-model-to-registry
        dependentTasks:
        - train-fashion-mnist
        inputs:
          artifacts:
            model_artifact:
              taskOutputArtifact:
                outputArtifactKey: model_output_uri
                producerTask: train-fashion-mnist
          parameters:
            display_name:
              runtimeValue:
                constant: fashion-mnist-model-registry
            location:
              runtimeValue:
                constant: asia-southeast1
            project:
              runtimeValue:
                constant: fashion-mnist-cloud
            serving_container_image_uri:
              runtimeValue:
                constant: asia-southeast1-docker.pkg.dev/fashion-mnist-cloud/fashion-mnist-repo/fastapi-predictor:v9
        taskInfo:
          name: upload-model-to-registry
  inputDefinitions:
    parameters:
      bucket_name:
        parameterType: STRING
      data_path:
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.16.1
